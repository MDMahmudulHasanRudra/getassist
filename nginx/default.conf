# getassist.pro static site. Runs inside the container on :8080 (non-root).
# TLS, HTTP->HTTPS and www->apex redirects are handled by the VPS reverse proxy.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Cloudflare Pages config files are not part of the site.
  location ~ ^/_(headers|redirects)$ {
    return 404;
  }

  # Canonical URLs have no trailing slash and no .html extension.
  location ~ ^(?<canon>/.+)/$ {
    return 301 $canon$is_args$args;
  }
  location ~ ^(?<canon>/.*)\.html$ {
    if ($canon = /index) { return 301 /$is_args$args; }
    if ($canon = /404) { return 404; }
    return 301 $canon$is_args$args;
  }

  # Served in place (no internal redirect, so the .html rule above never sees it).
  location = / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
