# Host nginx vhost for getassist.pro (use only if the VPS already runs nginx on 80/443).
# Copy to /etc/nginx/sites-available/getassist.pro.conf, symlink into sites-enabled,
# adjust PORT if WEB_PORT is not 8081, then: sudo nginx -t && sudo systemctl reload nginx
# Certificates: issue the same way the existing sites do, e.g.
#   sudo certbot certonly --nginx -d getassist.pro -d www.getassist.pro
# Until the certificate exists, keep only the port-80 server blocks enabled.

# HTTP -> HTTPS (apex and www)
server {
  listen 80;
  listen [::]:80;
  server_name getassist.pro www.getassist.pro;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://getassist.pro$request_uri; }
}

# www -> apex over HTTPS
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.getassist.pro;
  ssl_certificate     /etc/letsencrypt/live/getassist.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/getassist.pro/privkey.pem;
  return 301 https://getassist.pro$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name getassist.pro;
  ssl_certificate     /etc/letsencrypt/live/getassist.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/getassist.pro/privkey.pem;

  # Add only after HTTPS is verified; start short. No includeSubDomains/preload
  # without the owner's approval (app.getassist.pro is on the same domain).
  # add_header Strict-Transport-Security "max-age=300" always;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
